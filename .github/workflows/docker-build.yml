name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'kid_refresh_server.py'
      - 'kid_control.py'
      - 'db.py'
      - 'config.py'
      - 'video_analyzer.py'
      - 'domain_rules.json'
      - 'video_thresholds.json'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kid-monitor:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kid-monitor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
